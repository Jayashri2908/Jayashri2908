<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-label="Terminal banner: Jayashri Utrankar, software developer working on AI/ML and full-stack systems">
  <defs>
    <clipPath id="panel">
      <rect x="0.5" y="0.5" width="879" height="351" rx="14"/>
    </clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7EE787" stop-opacity="0.085"/>
      <stop offset="1" stop-color="#7EE787" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EE787" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#7EE787" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7EE787" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .cursor{animation:blink 1.1s steps(1,end) infinite}
      @media (prefers-reduced-motion:reduce){.cursor{animation:none;opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#panel)">
    <rect x="0.5" y="0.5" width="879" height="351" fill="#0D1117"/>
    <ellipse cx="240" cy="150" rx="330" ry="160" fill="url(#glow)"/>

    <!-- accent edge -->
    <rect x="0.5" y="41" width="3" height="311" fill="url(#stripe)"/>

    <!-- title bar -->
    <circle cx="26" cy="21" r="6" fill="#FF5F57"/>
    <circle cx="46" cy="21" r="6" fill="#FEBC2E"/>
    <circle cx="66" cy="21" r="6" fill="#28C840"/>
    <text class="mono" x="440" y="25" text-anchor="middle" font-size="12" letter-spacing="0.8" fill="#6E7A6E">jayashri@github: ~</text>
    <line x1="0.5" y1="41" x2="879.5" y2="41" stroke="#1F2A20"/>

    <!-- faint constellation: systems / ML texture across the right half -->
    <g stroke="#7EE787" stroke-opacity="0.10" stroke-width="1">
      <line x1="612" y1="88"  x2="676" y2="62"/>
      <line x1="676" y1="62"  x2="742" y2="96"/>
      <line x1="742" y1="96"  x2="806" y2="70"/>
      <line x1="806" y1="70"  x2="852" y2="122"/>
      <line x1="612" y1="88"  x2="700" y2="150"/>
      <line x1="700" y1="150" x2="770" y2="178"/>
      <line x1="770" y1="178" x2="836" y2="196"/>
      <line x1="852" y1="122" x2="836" y2="196"/>
      <line x1="660" y1="224" x2="700" y2="150"/>
      <line x1="660" y1="224" x2="742" y2="258"/>
      <line x1="742" y1="258" x2="818" y2="280"/>
      <line x1="742" y1="258" x2="770" y2="178"/>
      <line x1="690" y1="306" x2="818" y2="280"/>
    </g>
    <g fill="#7EE787" fill-opacity="0.22">
      <circle cx="612" cy="88"  r="2"/>
      <circle cx="676" cy="62"  r="2.5"/>
      <circle cx="742" cy="96"  r="2"/>
      <circle cx="806" cy="70"  r="2.5"/>
      <circle cx="852" cy="122" r="2"/>
      <circle cx="700" cy="150" r="3"/>
      <circle cx="770" cy="178" r="2"/>
      <circle cx="836" cy="196" r="2.5"/>
      <circle cx="660" cy="224" r="2"/>
      <circle cx="742" cy="258" r="2.5"/>
      <circle cx="818" cy="280" r="2"/>
      <circle cx="690" cy="306" r="2"/>
    </g>

    <!-- whoami -->
    <text class="mono" y="80" font-size="14">
      <tspan x="32" fill="#7EE787">~</tspan>
      <tspan x="52" fill="#6E7A6E">$</tspan>
      <tspan x="72" fill="#C9D1C9">whoami</tspan>
    </text>

    <!-- name -->
    <text class="mono" x="32" y="130" font-size="44" font-weight="700" letter-spacing="0.5" fill="#E6EDF3">Jayashri Utrankar</text>

    <!-- role -->
    <text class="mono" x="32" y="164" font-size="16" fill="#C9D1C9">
      <tspan>software developer</tspan>
      <tspan fill="#7EE787">&#160;·&#160;</tspan>
      <tspan>ai/ml</tspan>
      <tspan fill="#7EE787">&#160;·&#160;</tspan>
      <tspan>full-stack</tspan>
    </text>

    <!-- meta -->
    <text class="mono" x="32" y="192" font-size="13" fill="#6E7A6E">
      <tspan>Pune, India</tspan>
      <tspan fill="#3D4A40">&#160;·&#160;</tspan>
      <tspan>B.Tech CSE, Vishwakarma University</tspan>
      <tspan fill="#3D4A40">&#160;·&#160;</tspan>
      <tspan>2027</tspan>
    </text>

    <line x1="32" y1="216" x2="848" y2="216" stroke="#1A231C"/>

    <!-- ls -->
    <text class="mono" y="250" font-size="14">
      <tspan x="32" fill="#7EE787">~</tspan>
      <tspan x="52" fill="#6E7A6E">$</tspan>
      <tspan x="72" fill="#C9D1C9">ls ~/work</tspan>
    </text>

    <text class="mono" x="32" y="280" font-size="14" fill="#58A6FF">vu-fdp/&#160;&#160;&#160;scdo/&#160;&#160;&#160;upscaler-ai/&#160;&#160;&#160;baldness-ml/</text>

    <!-- prompt + cursor -->
    <text class="mono" y="320" font-size="14">
      <tspan x="32" fill="#7EE787">~</tspan>
      <tspan x="52" fill="#6E7A6E">$</tspan>
    </text>
    <rect class="cursor" x="72" y="306" width="9" height="17" fill="#7EE787"/>
  </g>

  <rect x="0.5" y="0.5" width="879" height="351" rx="14" fill="none" stroke="#1F2A20"/>
</svg>
